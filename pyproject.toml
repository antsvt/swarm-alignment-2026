[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "swarmbench-lite"
version = "0.1.0"
description = "A reproducible safety-compliance testbed for small LLM swarms"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
]
math = [
  "math-verify[antlr4_13_2]==0.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/swarm_alignment"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

